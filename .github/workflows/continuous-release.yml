name: Continuous Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: continuous-release
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare continuous pre-release
    runs-on: ubuntu-latest

    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update continuous pre-release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: continuous
        shell: bash
        run: |
          set -euo pipefail

          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force

          SHORT_SHA="${GITHUB_SHA:0:7}"
          TITLE="ZapZap continuous build ($SHORT_SHA)"
          NOTES="Automated pre-release for commit $GITHUB_SHA on main. Assets are replaced by every successful push."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --prerelease \
              --latest=false \
              --title "$TITLE" \
              --notes "$NOTES"

            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                if [[ -n "$asset" ]]; then
                  gh release delete-asset "$RELEASE_TAG" "$asset" --yes
                fi
              done
          else
            gh release create "$RELEASE_TAG" \
              --prerelease \
              --latest=false \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  appimage:
    name: Build AppImage
    needs: prepare-release
    uses: ./.github/workflows/build-appimage.yml
    with:
      release_upload: true
      release_tag: ${{ needs.prepare-release.outputs.release_tag }}
    secrets: inherit

  windows:
    name: Build Windows
    needs: prepare-release
    uses: ./.github/workflows/build-windows.yml
    with:
      release_upload: true
      release_tag: ${{ needs.prepare-release.outputs.release_tag }}
    secrets: inherit
